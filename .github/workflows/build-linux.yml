name: build-nfb-linux

# 同源码的 Linux 构建线路（macOS runner 排队拥堵时的备用）
# ubuntu runner 队列快、免费额度按 1x 计，和 macOS 那条互不影响。

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      THEOS: ${{ github.workspace }}/theos
      BUILD_DIR: ${{ github.workspace }}/fb

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          path: src

      - name: deps
        timeout-minutes: 8
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # GitHub 的 ubuntu-22.04 镜像已预装 clang / llvm / llvm-ranlib / llvm-strip / llvm-ar，
          # 这里只在缺 ld64.lld 时补装 lld（不跑 apt-get update，避免镜像抖动）
          echo "== 预装工具 =="
          clang --version | head -n1 || true
          command -v llvm-ranlib || command -v llvm-ranlib-14 || true
          command -v llvm-strip || command -v llvm-strip-14 || true
          command -v llvm-ar || command -v llvm-ar-14 || true
          command -v ld64.lld || command -v ld64.lld-14 || true

          if ! command -v ld64.lld >/dev/null 2>&1 && ! command -v ld64.lld-14 >/dev/null 2>&1; then
            echo "缺少 ld64.lld，尝试最小化安装 lld"
            sudo apt-get install -y --no-install-recommends lld-14 || \
            sudo apt-get install -y --no-install-recommends lld || true
          fi

          # 让 clang -fuse-ld=lld 一定能找到 ld64.lld
          if ! command -v ld64.lld >/dev/null 2>&1; then
            FOUND=$(command -v ld64.lld-14 || command -v ld64.lld-15 || true)
            if [ -n "$FOUND" ]; then
              sudo ln -sf "$FOUND" /usr/local/bin/ld64.lld
            fi
          fi
          command -v ld64.lld && ld64.lld --version || echo "警告：ld64.lld 仍未就绪"

      - name: theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos "$THEOS"
          # Linux 上没有独立的 procursus 工具链：把系统 clang / llvm 工具链软链到
          # build-ffmpeg.sh 期望的 $THEOS/toolchain/linux/iphone/bin 位置
          TC="$THEOS/toolchain/linux/iphone/bin"
          mkdir -p "$TC"
          ln -sf "$(command -v clang)" "$TC/clang"
          ln -sf "$(command -v clang++)" "$TC/clang++"
          ln -sf "$(command -v llvm-ar || command -v ar)" "$TC/ar"
          ln -sf "$(command -v llvm-ranlib || command -v llvm-ranlib-14 || command -v llvm-ranlib-15 || command -v ranlib)" "$TC/ranlib"
          ln -sf "$(command -v llvm-nm || command -v nm)" "$TC/nm"
          ln -sf "$(command -v llvm-strip || command -v strip)" "$TC/strip"
          ln -sf "$(command -v llvm-objcopy || command -v objcopy)" "$TC/objcopy"
          ls -l "$TC"

      - name: sdk
        run: |
          mkdir -p "$THEOS/sdks"
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv /tmp/sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: ffmpeg cache
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: src/deps/ffmpeg-kit-next/build
          key: nfb710-linux-ffmpeg-${{ hashFiles('src/deps/ffmpeg-kit-next/build-ffmpeg.sh') }}

      - name: build ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          cd src
          if [ ! -f deps/ffmpeg-kit-next/upstream/apple/src/FFmpegKit.m ]; then
            git init -q deps/ffmpeg-kit-next/upstream
            cd deps/ffmpeg-kit-next/upstream
            git remote add origin https://github.com/arthenica/ffmpeg-kit-next
            git fetch -q --depth 1 origin 3e223118e6e8fb6208693ecf3952e77cd096f587
            git checkout -q FETCH_HEAD
            cd "$GITHUB_WORKSPACE/src"
          fi
          sed -i -e 's/\r$//' deps/ffmpeg-kit-next/build-ffmpeg.sh
          bash deps/ffmpeg-kit-next/build-ffmpeg.sh

      - name: dump ffmpeg config log
        if: failure()
        run: |
          ls -d "$BUILD_DIR"/FFmpeg-* 2>/dev/null || true
          tail -n 120 "$BUILD_DIR"/FFmpeg-*/ffbuild/config.log 2>/dev/null || true

      - name: ldid-stub
        run: |
          # 只为交叉编译准备：TrollFools 注入时会自己重签，这里给个空实现
          sudo tee /usr/local/bin/ldid >/dev/null <<'EOF'
          #!/bin/sh
          exit 0
          EOF
          sudo chmod +x /usr/local/bin/ldid
          mkdir -p "$THEOS/bin"
          cp /usr/local/bin/ldid "$THEOS/bin/ldid"
          chmod +x "$THEOS/bin/ldid"
          ldid -S /dev/null && echo "ldid stub ok"

      - name: build tweak
        run: |
          cd src
          make clean || true
          set -o pipefail
          make 2>&1 | tee build.log

      - name: package
        run: |
          cd src
          DYLIB=$(find .theos/obj -name 'BHTwitter.dylib' | head -n1)
          echo "dylib = $DYLIB"
          test -n "$DYLIB"
          mkdir -p out
          cp "$DYLIB" out/BHTwitter-v7.1.0.dylib
          STAGE=$(mktemp -d)
          cp "$DYLIB" "$STAGE/BHTwitter.dylib"
          cp -R "layout/Library/Application Support/BHT/BHTwitter.bundle" "$STAGE/BHTwitter.bundle"
          ( cd "$STAGE" && zip -qry "$GITHUB_WORKSPACE/src/out/NFB-7.1.0-TrollFools.zip" . )
          make package || true
          cp packages/*.deb out/ 2>/dev/null || true
          ls -lh out


      - name: publish failure log
        if: failure()
        continue-on-error: true
        run: |
          cd src
          mkdir -p dist
          cp build.log dist/build-fail.log || true
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout -B artifacts-fail
          git add -f dist/build-fail.log
          git commit -m "ci: failure log $(date +%s)" || true
          git push --force origin artifacts-fail:artifacts-fail

      - name: publish dylib
        if: success()
        continue-on-error: true
        run: |
          cd src
          mkdir -p dist
          cp out/BHTwitter-v7.1.0.dylib dist/BHTwitter-v7.1.0.dylib
          cp out/NFB-7.1.0-TrollFools.zip dist/NFB-7.1.0-TrollFools.zip
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout -B artifacts-build
          git add -f dist
          git commit -m "ci: publish build $(date +%s)" || true
          git push --force origin artifacts-build:artifacts

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: NFB-7.1.0-linux
          path: src/out/*
          if-no-files-found: error
